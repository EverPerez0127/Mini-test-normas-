        function renderizarCategorias() {
            const container = document.getElementById('categorias-container');
            container.innerHTML = '';

            categorias.forEach(cat => {
                let normasCategoria = Object.entries(normasDB)
                    .filter(([_, norma]) => norma.categoria === cat.id);

                // Aplicar filtros
                if (filtroActual === "examen") {
                    normasCategoria = normasCategoria.filter(([_, norma]) => norma.examen);
                }

                if (busquedaActual) {
                    const busqueda = busquedaActual.toLowerCase();
                    normasCategoria = normasCategoria.filter(([codigo, norma]) => 
                        codigo.toLowerCase().includes(busqueda) ||
                        norma.titulo.toLowerCase().includes(busqueda) ||
                        norma.desc.toLowerCase().includes(busqueda)
                    );
                }

                if (normasCategoria.length === 0) return;

                const categoriaDiv = document.createElement('div');
                categoriaDiv.className = `categoria ${cat.id}`;
                
                categoriaDiv.innerHTML = `
                    <div class="categoria-header" style="background: ${cat.color}">
                        <span class="categoria-icon">${cat.icono}</span>
                        <h2>${cat.nombre}</h2>
                        <span style="margin-left: auto; background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 30px;">${normasCategoria.length}</span>
                    </div>
                    <div class="normas-grid">
                        ${normasCategoria.map(([codigo, norma]) => `
                            <div class="norma-card ${norma.examen ? 'importante' : ''}" onclick="abrirTarjeta('${codigo}')">
                                <div class="norma-code">${codigo}</div>
                                <div class="norma-title">${norma.titulo.split(' ').slice(0,2).join(' ')}</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.appendChild(categoriaDiv);
            });
        }
